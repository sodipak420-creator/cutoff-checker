<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f7f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    h2 {
      font-size: 20px;
      color: #1f2937;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 24px;
    }
    .phone-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    select {
      width: 95px;
      padding: 12px 8px;
      font-size: 15px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #f9fafb;
      color: #1f2937;
      outline: none;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #f9fafb;
      outline: none;
      color: #1f2937;
    }
    input:focus, select:focus {
      border-color: #25D366;
      background: #ffffff;
    }
    .msg-group {
      margin-bottom: 20px;
    }
    .msg-group input {
      width: 100%;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-paste {
      background-color: #f3f4f6;
      color: #374151;
    }
    .btn-open {
      background-color: #25D366;
      color: #ffffff;
    }
    .history-card {
      margin-top: 24px;
      border-top: 1px solid #f3f4f6;
      padding-top: 16px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f9fafb;
      margin-bottom: 8px;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Direct Message</h2>
    <p class="subtitle">Chat on WhatsApp without saving contacts.</p>

    <div class="phone-row">
      <select id="countryCode">
        <option value="91" selected>🇮🇳 +91</option>
        <option value="1">🇺🇸 +1</option>
        <option value="44">🇬🇧 +44</option>
        <option value="971">🇦🇪 +971</option>
        <option value="966">🇸🇦 +966</option>
      </select>
      <input type="tel" id="phoneNumber" placeholder="10-digit number">
    </div>

    <div class="msg-group">
      <input type="text" id="message" placeholder="Optional prefilled message...">
    </div>

    <button class="btn btn-paste" onclick="pasteNumber()">📋 Paste Number</button>
    <button class="btn btn-open" onclick="openWhatsApp()">💬 Open WhatsApp</button>

    <div class="history-card" id="historySection" style="display:none;">
      <div class="history-header">
        <span>Recent Chats</span>
        <span onclick="clearHistory()" style="cursor:pointer; color:#ef4444;">Clear</span>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const phoneInput = document.getElementById('phoneNumber');
    const msgInput = document.getElementById('message');
    const codeSelect = document.getElementById('countryCode');

    loadHistory();

    async function pasteNumber() {
      try {
        const text = await navigator.clipboard.readText();
        let cleaned = text.replace(/[^\d]/g, '');
        if (cleaned.startsWith('91') && cleaned.length > 10) {
          codeSelect.value = '91';
          cleaned = cleaned.slice(2);
        }
        phoneInput.value = cleaned;
      } catch (err) {
        alert("Clipboard permission required.");
      }
    }

    function openWhatsApp() {
      let num = phoneInput.value.replace(/[^\d]/g, '');
      const code = codeSelect.value;
      const msg = encodeURIComponent(msgInput.value.trim());

      if (!num || num.length < 5) {
        alert("Enter a valid phone number.");
        return;
      }

      const fullNumber = code + num;
      saveToHistory(fullNumber);

      let url = 'https://wa.me/' + fullNumber;
      if (msg) url += '?text=' + msg;
      window.location.href = url;
    }

    function saveToHistory(fullNumber) {
      let history = JSON.parse(localStorage.getItem('dchat_history') || '[]');
      history = history.filter(item => item !== fullNumber);
      history.unshift(fullNumber);
      if (history.length > 4) history.pop();
      localStorage.setItem('dchat_history', JSON.stringify(history));
      loadHistory();
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('dchat_history') || '[]');
      const container = document.getElementById('historySection');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      list.innerHTML = '';
      history.forEach(num => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<span>+${num}</span><span style="color:#25D366; font-weight:600;">Chat ›</span>`;
        div.onclick = () => { window.location.href = 'https://wa.me/' + num; };
        list.appendChild(div);
      });
    }

    function clearHistory() {
      localStorage.removeItem('dchat_history');
      loadHistory();
    }
  </script>
</body>
</html>
