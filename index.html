<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-Chat</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 6px 0;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 20px 0;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .country-code {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #25D366;
    }
    textarea {
      resize: vertical;
      min-height: 48px;
      margin-bottom: 12px;
    }
    .btn-paste {
      width: 100%;
      padding: 10px;
      background: #f1f5f9;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-send {
      width: 100%;
      padding: 14px;
      background: #25D366;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
    }
    .btn-send:active {
      background: #20ba5a;
    }
    #history-container {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }
    .btn-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .history-item {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
      border: 1px solid #f1f5f9;
    }
    .ad-container {
      margin: 20px auto;
      text-align: center;
      width: 100%;
      max-width: 300px;
      min-height: 250px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Direct Message</h1>
    <p class="subtitle">Chat on WhatsApp without saving contacts.</p>

    <div class="input-group">
      <div class="country-code">
        <span>🇮🇳 +91</span>
      </div>
      <input type="tel" id="phone" placeholder="10-digit number" maxlength="10" />
    </div>

    <textarea id="message" placeholder="Optional prefilled message..."></textarea>

    <button class="btn-paste" onclick="pasteNumber()">
      📋 Paste Number
    </button>

    <button class="btn-send" onclick="sendWhatsApp()">
      💬 Open WhatsApp
    </button>
  </div>

  <div id="history-container" style="display: none;">
    <div class="history-header">
      <span class="history-title">Recent Numbers</span>
      <button class="btn-clear" onclick="clearHistory()">Clear</button>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- Adsterra 300x250 Banner Placement -->
  <div class="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : '9a370aa8344fedb2a5fd3061f59f8f30',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/9a370aa8344fedb2a5fd3061f59f8f30/invoke.js"></script>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadHistory);

    async function pasteNumber() {
      try {
        const text = await navigator.clipboard.readText();
        const cleaned = text.replace(/[^0-9]/g, "");
        const formatted = cleaned.length > 10 ? cleaned.slice(-10) : cleaned;
        document.getElementById("phone").value = formatted;
      } catch (err) {
        alert("Clipboard permission denied or unavailable.");
      }
    }

    function sendWhatsApp() {
      const phoneInput = document.getElementById("phone").value.replace(/[^0-9]/g, "");
      const message = encodeURIComponent(document.getElementById("message").value.trim());

      if (phoneInput.length !== 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
      }

      saveNumber(phoneInput);

      const url = `https://wa.me/91${phoneInput}${message ? `?text=${message}` : ""}`;
      window.location.href = url;
    }

    function saveNumber(num) {
      let history = JSON.parse(localStorage.getItem("dchat_history") || "[]");
      history = history.filter(item => item !== num);
      history.unshift(num);
      if (history.length > 5) history.pop();
      localStorage.setItem("dchat_history", JSON.stringify(history));
      loadHistory();
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem("dchat_history") || "[]");
      const container = document.getElementById("history-container");
      const list = document.getElementById("history-list");

      if (history.length === 0) {
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      list.innerHTML = "";

      history.forEach(num => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<span>+91 ${num}</span><span>↗</span>`;
        div.onclick = () => {
          document.getElementById("phone").value = num;
        };
        list.appendChild(div);
      });
    }

    function clearHistory() {
      localStorage.removeItem("dchat_history");
      loadHistory();
    }
  </script>

</body>
</html>
