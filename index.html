<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#25D366" />
  <title>D-Chat</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 20px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; }
    h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 6px 0; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px 0; }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    select.country-select {
      width: 110px;
      padding: 12px 6px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      outline: none;
    }
    input, textarea { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: #25D366; }
    textarea { resize: vertical; min-height: 48px; margin-bottom: 12px; }
    .btn-paste { width: 100%; padding: 10px; background: #f1f5f9; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
    .btn-send { width: 100%; padding: 14px; background: #25D366; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
    .btn-send:active { background: #20ba5a; }
    .btn-install { display: none; width: 100%; padding: 12px; background: #0f172a; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: #ffffff; cursor: pointer; margin-top: 10px; }
    .ad-container { margin: 20px auto; text-align: center; width: 100%; max-width: 300px; min-height: 250px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Direct Message</h1>
    <p class="subtitle">Chat on WhatsApp without saving contacts.</p>

    <div class="input-group">
      <select id="countryCode" class="country-select">
        <option value="91" selected>🇮🇳 +91</option>
        <option value="1">🇺🇸 +1</option>
        <option value="44">🇬🇧 +44</option>
        <option value="971">🇦🇪 +971</option>
        <option value="966">🇸🇦 +966</option>
        <option value="92">🇵🇰 +92</option>
        <option value="880">🇧🇩 +880</option>
        <option value="61">🇦🇺 +61</option>
        <option value="49">🇩🇪 +49</option>
        <option value="1">🇨🇦 +1</option>
        <option value="other">🌐 Other</option>
      </select>
      <input type="tel" id="phone" placeholder="Phone number" />
    </div>

    <textarea id="message" placeholder="Optional prefilled message..."></textarea>

    <button class="btn-paste" onclick="pasteNumber()">📋 Paste Number</button>
    <button class="btn-send" onclick="sendWhatsApp()">💬 Open WhatsApp</button>
    <button class="btn-install" id="installBtn">⬇ Install D-Chat App</button>
  </div>

  <!-- Adsterra 300x250 Banner Placement -->
  <div class="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : '9a370aa8344fedb2a5fd3061f59f8f30',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/9a370aa8344fedb2a5fd3061f59f8f30/invoke.js"></script>
  </div>

  <script>
    async function pasteNumber() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("phone").value = text.replace(/[^0-9]/g, "");
      } catch (err) {
        alert("Clipboard permission denied or unavailable.");
      }
    }

    function sendWhatsApp() {
      let code = document.getElementById("countryCode").value;
      let phoneInput = document.getElementById("phone").value.replace(/[^0-9]/g, "");
      const message = encodeURIComponent(document.getElementById("message").value.trim());

      if (!phoneInput) {
        alert("Please enter a valid phone number.");
        return;
      }

      // If user selected 'Other', expect them to include the country code directly
      let fullNumber = (code === "other") ? phoneInput : (code + phoneInput);

      window.location.href = `https://wa.me/${fullNumber}${message ? `?text=${message}` : ""}`;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") installBtn.style.display = "none";
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
