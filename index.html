<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Cutoff Checker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0f172a; color: #fff; padding: 20px; }
  .card { max-width: 450px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
  h2 { color: #38bdf8; margin-bottom: 12px; font-size: 18px; }
  label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
  input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; font-size: 14px; }
  input, select { background: #0f172a; border: 1px solid #334155; color: #fff; outline: none; }
  button { background: #38bdf8; color: #000; font-weight: bold; border: none; margin-top: 16px; cursor: pointer; }
  #results { margin-top: 16px; }
  .item { background: #0f172a; border-left: 4px solid #38bdf8; padding: 10px; margin-top: 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>College Eligibility Checker</h2>
  <label>Enter Percentage (%)</label>
  <input type="number" id="marks" placeholder="e.g. 72" min="35" max="100">
  <label>Select Stream</label>
  <select id="stream">
    <option value="Science">Science</option>
    <option value="Commerce">Commerce</option>
    <option value="Arts">Arts</option>
    <option value="Diploma">Diploma / Polytechnic</option>
  </select>
  <button onclick="check()">Find Eligible Colleges</button>
  <div id="results"></div>
</div>
<script>
  const colleges = [
    { name: "City Junior College of Science", stream: "Science", min: 70 },
    { name: "Government Polytechnic", stream: "Diploma", min: 55 },
    { name: "National Commerce Academy", stream: "Commerce", min: 60 },
    { name: "Dr. B.R. Memorial College", stream: "Arts", min: 45 }
  ];
  function check() {
    const val = parseFloat(document.getElementById('marks').value);
    const str = document.getElementById('stream').value;
    const out = document.getElementById('results');
    out.innerHTML = "";
    if (!val) return alert("Enter marks first");
    const matched = colleges.filter(c => c.stream === str && val >= c.min);
    if (!matched.length) { out.innerHTML = "<p style='color:#ef4444;margin-top:10px;'>No matching colleges found.</p>"; return; }
    matched.forEach(c => {
      out.innerHTML += `<div class="item"><strong>${c.name}</strong><br><small>Stream: ${c.stream} | Cutoff: ${c.min}%</small></div>`;
    });
  }
</script>
</body>
</html>
